[project]
name = "solace-trading-lab"
version = "0.1.0"
description = "A deterministic event-driven trading systems laboratory built around Solace PubSub+."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "pytest>=8.3.0",
    "solace-pubsubplus>=1.7.0",
    "uvicorn[standard]>=0.30.0",
]

[project.scripts]
solace-exchange = "exchange.main:run"
solace-market-data = "market_data.main:run"
solace-strategy = "strategy.main:run"
solace-replay = "replay.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/common", "src/exchange", "src/market_data", "src/strategy", "src/chaos", "src/replay"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
